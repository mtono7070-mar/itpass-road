# ============================================================
# 店舗情報ファイル（client.toml）
# ・"" の中を書き換えてください。分からない項目は空欄 "" のままでOK。
# ・ここに書いた内容だけが投稿文に使われます（効果・実績・口コミを勝手に作りません）。
# ・施術効果をうたう表現（「シミが消える」「痩せる」など）は書かないでください。
#   書いた場合はチェック機能が警告します。
# ============================================================

[salon]
name = "サロン名"
business_type = "エステサロン"     # 例：エステサロン / 美容室 / ネイルサロン / まつげサロン
area = "地域名"                     # 例：吉祥寺（ハッシュタグに使います）
access = ""                         # 例：吉祥寺駅 徒歩5分
concept = ""                        # お店のコンセプト（店舗から聞いた言葉で）
target = ""                         # 例：30〜40代の働く女性
tone = "やさしい"                   # やさしい / 上品 / 親しみ
use_emoji = true                    # 絵文字を使うなら true、使わないなら false
reservation = "プロフィールのリンクからご予約いただけます"
features = []                       # 例：["完全個室", "女性スタッフのみ", "駐車場あり"]（事実のみ）
first_visit_flow = []               # 例：["ご予約", "カウンセリング", "施術", "アフターのご説明"]

# メニュー（必要な数だけ [[menus]] ブロックをコピーして増やす）
[[menus]]
name = "メニュー名"
duration = ""                       # 例：60分
price = ""                          # 例：8,800円（税込）。空欄なら料金は投稿に載せません
description = ""                    # 店舗から聞いた説明のみ。効果の断定はNG
concerns = []                       # 例：["乾燥", "肌のごわつき"]（「〜が気になる方へ」として使います）

# よくある質問（任意。店舗に確認した回答のみ）
# [[faqs]]
# q = "当日予約はできますか？"
# a = "空きがあれば可能です。DMでお問い合わせください。"

# スタッフ紹介（任意。本人の掲載同意を取ってから）
# [[staff]]
# name = "山田"
# role = "オーナー"
# message = "一人ひとりのお話を大切にしています。"

[hashtags]
max = 5                             # 1投稿あたりの上限（Instagramの仕様に合わせて変更可）
keywords = ["エステ"]               # 地域名と組み合わせる語。例：["エステ", "フェイシャル"]
custom = []                         # 必ず入れたいタグ（#なしで）。例：["吉祥寺サロン"]

[privacy]
photo_consent = false               # 写真の使用許諾・写り込み人物の同意を確認したら true
ng_words = []                       # 店舗が使ってほしくない言葉。例：["激安"]
