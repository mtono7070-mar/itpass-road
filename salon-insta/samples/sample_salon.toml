# 架空サロンのサンプル設定です（実在の店舗ではありません）。
# 料金・効果・口コミ・実績は意図的に入れていません。

[salon]
name = "アトリエ・ソラノハ（架空サロン）"
business_type = "エステサロン"
area = "吉祥寺"
access = "吉祥寺駅から徒歩圏内（架空）"
concept = "忙しい毎日の中で、ひと息つける時間をつくるプライベートサロン"
target = "30〜40代の働く女性"
tone = "やさしい"
use_emoji = true
reservation = "プロフィールのリンクからご予約いただけます"
features = ["完全個室", "女性スタッフ対応", "平日20時まで受付"]
first_visit_flow = ["ご予約", "カウンセリングシートのご記入", "肌状態の確認とメニューのご相談", "施術", "ご自宅でのお手入れのご相談"]
sample = true

[[menus]]
name = "保湿フェイシャル"
duration = "60分"
price = ""
description = "クレンジングから保湿までを、肌の状態を確認しながら丁寧に行うフェイシャルケアです。"
concerns = ["乾燥", "肌のごわつき"]

[[menus]]
name = "デコルテ・肩まわりケア"
duration = "45分"
price = ""
description = "デスクワークで縮こまりがちな肩まわりとデコルテを、オイルを使ってやさしくほぐしていくメニューです。"
concerns = ["肩まわりのこわばり"]

[[faqs]]
q = "はじめてでも大丈夫ですか？"
a = "はい。最初にカウンセリングの時間をとり、ご希望をうかがってから施術内容をご相談します。"

[[faqs]]
q = "メイクをしたまま行っても大丈夫ですか？"
a = "はい。メイク落としはサロンでご用意しています。"

[[staff]]
name = "ソラ"
role = "オーナー（架空）"
message = "お話をうかがう時間を大切にしています。気になることは何でもご相談ください。"

[hashtags]
max = 5
keywords = ["エステ", "フェイシャル"]
custom = ["プライベートサロン"]

[privacy]
photo_consent = true
ng_words = []
