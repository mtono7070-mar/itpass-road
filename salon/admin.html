<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1EA">
<meta name="robots" content="noindex">
<title>yosayosapark yuki 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F1EA; --card:#FFFDF9; --ink:#2B2522; --muted:#7A6E66; --line:#E4D9CC;
  --accent:#A65E46; --accent-soft:#F1E1D7; --on-accent:#FFFDF9; --ok:#4E7A5A; --ok-soft:#E3EDE5;
  --warn:#B8862B; --danger:#B5463F; --off:#C9BEB3; --block:#EAE3DA;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1816; --card:#26211E; --ink:#F2EAE2; --muted:#B3A79D; --line:#3D3530;
  --accent:#D8957C; --accent-soft:#3A2A23; --on-accent:#1C1816; --ok:#8FC09C; --ok-soft:#24322A;
  --warn:#D9B061; --danger:#E08279; --off:#5A504A; --block:#2E2824;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1816; --card:#26211E; --ink:#F2EAE2; --muted:#B3A79D; --line:#3D3530;
  --accent:#D8957C; --accent-soft:#3A2A23; --on-accent:#1C1816; --ok:#8FC09C; --ok-soft:#24322A;
  --warn:#D9B061; --danger:#E08279; --off:#5A504A; --block:#2E2824;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

.sample{background:var(--accent);color:var(--on-accent);font-size:12px;text-align:center;padding:6px 16px}

header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.logo{font-family:var(--serif);font-size:18px;letter-spacing:.06em;white-space:nowrap}
.logo small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.1em}
header.top .spacer{flex:1}
.user{font-size:12px;color:var(--muted);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:8px 16px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.btn:hover{opacity:.88}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:20px 0 14px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .arrow{width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:16px}
.datenav h1{font-size:22px;margin:0 8px;min-width:9.5em;text-align:center}
.toolbar .spacer{flex:1}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;text-align:center;line-height:1.35}
.wd small{display:block;font-size:11px;color:var(--muted)}
.wd b{font-family:var(--serif);font-size:18px;font-weight:500}
.wd .cnt{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.wd .cnt i{font-style:normal;color:var(--ink);font-weight:700}
.wd.sat small:first-child{color:#4A74B8}.wd.sun small:first-child{color:#C0504D}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.wd.today b{color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:24px;line-height:1.3}
.stat .v small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:2px}
.stat .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent)}

/* main layout */
.main > *{min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;padding-bottom:48px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel > header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel > header h2{font-size:16px}
.panel > header .hint{font-size:12px;color:var(--muted)}

/* timeline */
.tl{position:relative;margin:12px 16px 16px 56px}
.tl .hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.tl .hr.half{border-top-style:dashed;opacity:.6}
.tl .hr span{position:absolute;top:-9px;left:0;background:var(--card);padding-right:4px}
.tl .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--danger);z-index:3}
.tl .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.ev{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;justify-content:flex-start;border-radius:8px;padding:6px 10px;overflow:hidden;text-align:left;border:1px solid var(--accent);background:var(--accent-soft);line-height:1.45;z-index:2}
.ev .t{font-size:11px;color:var(--muted)}
.ev .n{font-weight:700;font-size:13px}
.ev .m{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{border-color:var(--ok);background:var(--ok-soft)}
.ev.cancelled{border-style:dashed;border-color:var(--off);background:transparent;color:var(--muted);text-decoration:line-through}
.ev.sel{outline:2px solid var(--ink);outline-offset:1px}
.ev.blk{border:1px dashed var(--muted);background:repeating-linear-gradient(45deg,var(--block) 0 8px,transparent 8px 16px);color:var(--muted)}
.ev .first{display:inline-block;font-size:10px;border-radius:4px;padding:0 5px;background:var(--accent);color:var(--on-accent);margin-left:6px;vertical-align:1px;text-decoration:none}

/* list + detail */
.list{list-style:none;margin:0;padding:6px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:10px}
.row:hover{background:var(--bg)}
.row[aria-pressed="true"]{background:var(--accent-soft)}
.row .time{font-family:var(--serif);font-size:16px;width:3.2em;flex:none}
.row .who{flex:1;min-width:0}
.row .who b{font-weight:700}
.row .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.confirmed{color:var(--accent)}
.pill.done{color:var(--ok)}
.pill.cancelled{color:var(--muted)}
.pill.new{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:28px 16px;font-size:13px}

.detail{padding:16px}
.detail h3{font-size:20px}
.detail .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.detail dl{display:grid;grid-template-columns:6.5em 1fr;gap:6px 12px;margin:0 0 16px}
.detail dt{color:var(--muted);font-size:12px;padding-top:2px}
.detail dd{margin:0}
.detail dd a{color:var(--accent)}
.detail .menus{margin:0;padding:0;list-style:none}
.detail .menus li{display:flex;justify-content:space-between;gap:12px}
.detail .menus li.total{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}
.detail .note{background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px;white-space:pre-wrap}
.detail .actions{display:flex;gap:8px;flex-wrap:wrap}
.detail .memo{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;margin-top:4px;resize:vertical}
.right{display:flex;flex-direction:column;gap:16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,15,12,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal .box{background:var(--card);border-radius:var(--r);width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px}
.modal h2{font-size:18px;margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.opts label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px;margin:0}
.opts input{width:auto}
.modal .err{color:var(--danger);font-size:12px;min-height:1.2em}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;z-index:40;white-space:nowrap}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .user,.logo small{display:none}
  .datenav h1{font-size:18px;min-width:0;margin:0 4px}
  .toolbar .spacer{display:none}
  .toolbar .acts{display:flex;gap:8px;width:100%}
  .toolbar .acts .btn{flex:1}
  .week{gap:4px}
  .wd{padding:6px 0}
  .wd b{font-size:15px}
  .stat .v{font-size:20px}
}
</style>
</head>
<body>

<div class="sample">これは管理画面の見本です。表示している予約は仮のデータで、操作しても保存されません。</div>

<header class="top">
  <div class="wrap">
    <div class="logo">yosayosapark yuki<small>管理画面</small></div>
    <div class="spacer"></div>
    <span class="user">ログイン中：オーナー</span>
    <a class="btn plain" href="./" style="text-decoration:none">予約ページ</a>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="datenav">
      <button class="arrow" id="prev" type="button" aria-label="前の日">‹</button>
      <h1 id="dateTitle"></h1>
      <button class="arrow" id="nextDay" type="button" aria-label="次の日">›</button>
      <button class="btn plain" id="today" type="button" style="margin-left:6px">今日</button>
    </div>
    <div class="spacer"></div>
    <div class="acts">
      <button class="btn ghost" id="openBlock" type="button">受付を止める</button>
      <button class="btn" id="openAdd" type="button">＋ 予約を追加</button>
    </div>
  </div>

  <div class="week" id="week"></div>
  <div class="stats" id="stats"></div>

  <div class="main">
    <section class="panel">
      <header><h2>タイムテーブル</h2><span class="hint">予約をタップすると詳細が開きます</span></header>
      <div class="tl" id="tl"></div>
    </section>

    <div class="right">
      <section class="panel" id="detailPanel" hidden>
        <header><h2>予約の詳細</h2><button class="btn plain" id="closeDetail" type="button" style="padding:4px 10px">閉じる</button></header>
        <div class="detail" id="detail"></div>
      </section>
      <section class="panel">
        <header><h2>この日の予約</h2><span class="hint" id="listCount"></span></header>
        <ul class="list" id="list"></ul>
      </section>
    </div>
  </div>
</main>

<div class="modal" id="addModal" hidden>
  <form class="box" id="addForm" novalidate>
    <h2>予約を追加（電話・来店での受付）</h2>
    <div class="f"><label for="aName">お名前</label><input id="aName" name="name" placeholder="山田 花子"></div>
    <div class="f"><label for="aTel">電話番号</label><input id="aTel" name="tel" type="tel" placeholder="090-1234-5678"></div>
    <div class="f2">
      <div class="f"><label for="aDate">日付</label><input id="aDate" name="date" type="date"></div>
      <div class="f"><label for="aTime">開始時間</label><select id="aTime" name="time"></select></div>
    </div>
    <div class="f"><label for="aMenu">メニュー</label><select id="aMenu" name="menu"></select></div>
    <div class="f"><label>オプション</label><div class="opts" id="aOpts"></div></div>
    <div class="f"><label for="aNote">メモ</label><textarea id="aNote" name="note" rows="2"></textarea></div>
    <div class="err" id="addErr"></div>
    <div class="foot"><button type="button" class="btn plain" data-close>やめる</button><button class="btn" type="submit">追加する</button></div>
  </form>
</div>

<div class="modal" id="blockModal" hidden>
  <form class="box" id="blockForm" novalidate>
    <h2>受付を止める</h2>
    <p style="margin:0 0 14px;font-size:13px;color:var(--muted)">臨時休業やメンテナンスなど、予約を受け付けない時間を設定します。お客様の予約ページでは選べなくなります。</p>
    <div class="f"><label for="bDate">日付</label><input id="bDate" name="date" type="date"></div>
    <div class="f"><label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" name="allday" id="bAll" style="width:auto"> 終日（臨時休業）</label></div>
    <div class="f2" id="bRange">
      <div class="f"><label for="bFrom">開始</label><select id="bFrom" name="from"></select></div>
      <div class="f"><label for="bTo">終了</label><select id="bTo" name="to"></select></div>
    </div>
    <div class="f"><label for="bReason">理由（お客様には表示されません）</label><input id="bReason" name="reason" placeholder="例：機器メンテナンス"></div>
    <div class="err" id="blockErr"></div>
    <div class="foot"><button type="button" class="btn plain" data-close>やめる</button><button class="btn" type="submit">設定する</button></div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // 予約ページ（index.html）と同じメニュー
  const MENUS = [
    {id:"slim", name:"全身痩せコース", price:8800, min:90},
    {id:"detox-full", name:"デトックスフルコース", price:11800, min:120},
    {id:"rakushibori-f", name:"楽しぼりコース（女性）", price:5800, min:60},
    {id:"rakushibori-m", name:"楽しぼりコース（男性）", price:6800, min:60},
    {id:"h2-recovery", name:"水素まみれ疲労回復コース", price:9800, min:120},
    {id:"diet", name:"ダイエット特化脂肪燃焼コース", price:10800, min:120},
    {id:"deluxe", name:"デラックス全身温活コース", price:12400, min:150},
    {id:"h2-detox", name:"水素デトックスコース", price:6000, min:60},
    {id:"foot30", name:"足湯デトックス【30分】", price:4000, min:30},
    {id:"foot60", name:"足湯デトックス【60分】", price:6500, min:60},
    {id:"opt-herb", name:"バーニングハーブ追加", price:1500, min:0, option:true},
    {id:"opt-h2", name:"水素吸入追加（45分）", price:3000, min:45, option:true},
    {id:"opt-humin", name:"フーミン（粘膜吸収）30cc", price:2500, min:0, option:true},
    {id:"opt-bolster", name:"ボルスターテラリンパ", price:2500, min:30, option:true},
    {id:"opt-cannula", name:"カニューレ（水素吸入初回のみ）", price:1000, min:0, option:true},
    {id:"opt-tansan", name:"炭酸パック", price:2500, min:20, option:true},
    {id:"opt-footbath", name:"水素フットバス", price:2000, min:30, option:true},
  ];
  const MENU = Object.fromEntries(MENUS.map(m => [m.id, m]));
  const COURSES = MENUS.filter(m => !m.option);
  const OPTIONS = MENUS.filter(m => m.option);
  const OPEN = 600, CLOSE = 1230; // 10:00〜20:30（分）
  const PX = 1.3; // タイムテーブル 1分あたりの高さ

  // ---- helpers ----
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, "0");
  const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); };
  const hm = m => `${Math.floor(m/60)}:${pad(m%60)}`;
  const yen = n => "¥" + n.toLocaleString("ja-JP");
  const DOW = ["日","月","火","水","木","金","土"];
  const fmtDate = k => { const d = fromKey(k); return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }
  function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  const TODAY = toKey(new Date());

  // ---- 仮のデータ ----
  const NAMES = ["佐藤 美咲","鈴木 健太","高橋 由美","田中 涼子","伊藤 大輔","渡辺 彩","山本 直子","中村 拓也","小林 恵","加藤 さくら","吉田 真理","山田 翔","松本 香織","井上 聡","木村 麻衣"];
  const NOTES = ["", "", "", "冷え性で足先が冷たいです", "", "ゴルフ後の疲れをとりたい", "", "汗をかきにくい体質です", "", "前回より少し温度低めで"];
  const bookings = [];
  const blocks = [];
  function seedDay(k){
    let t = OPEN + (hash(k) % 3) * 30;
    let i = 0;
    while (true){
      const h = hash(k + ":" + i);
      const course = COURSES[h % COURSES.length];
      const menus = [course.id];
      const first = h % 5 === 0;
      if (first) menus.push("opt-cannula");
      if (h % 7 === 1) menus.push("opt-herb");
      if (h % 9 === 2) menus.push("opt-tansan");
      const dur = menus.reduce((s, id) => s + MENU[id].min, 0);
      if (t + dur > CLOSE) break;
      if (h % 4 !== 0){ // 4枠に1つくらいは空ける
        const past = k < TODAY || (k === TODAY && t + dur <= nowMin());
        bookings.push({
          no:"YUKI-" + (h % 1000000).toString(36).toUpperCase().padStart(4, "0"),
          date:k, start:t, duration:dur, menus,
          price:menus.reduce((s, id) => s + MENU[id].price, 0),
          cust:{name:NAMES[h % NAMES.length], tel:`090-${pad(h % 100)}${pad((h >> 3) % 100)}-${pad((h >> 5) % 100)}${pad((h >> 7) % 100)}`, email:"sample@example.com", visit:first ? "初めて" : "2回目以降", note:NOTES[h % NOTES.length]},
          status: h % 11 === 3 ? "cancelled" : past ? "done" : "confirmed",
          via: h % 6 === 0 ? "電話" : "Web",
          createdAt: addDays(k, -((h % 9) + 1)),
          memo:"",
        });
      }
      t += dur + 30 * (h % 2);
      i++;
    }
  }
  for (let i = -7; i <= 21; i++) seedDay(addDays(TODAY, i));
  blocks.push({date:addDays(TODAY, 3), from:780, to:900, reason:"機器メンテナンス"});

  // この端末で予約ページから入った予約も合わせて表示する
  try {
    for (const b of JSON.parse(localStorage.getItem("noa-bookings-v1")) || []){
      bookings.push({...b, via:"Web（この端末）", memo:""});
    }
  } catch {}

  // ---- state ----
  let day = TODAY;
  let selected = null;

  const dayBookings = k => bookings.filter(b => b.date === k).sort((a, b) => a.start - b.start);
  const active = b => b.status !== "cancelled";

  // ---- render ----
  function renderWeek(){
    // 選択日を含む月曜はじまりの1週間
    const d = fromKey(day); const mon = addDays(day, -((d.getDay() + 6) % 7));
    let html = "";
    for (let i = 0; i < 7; i++){
      const k = addDays(mon, i); const dd = fromKey(k);
      const list = dayBookings(k).filter(active);
      const cls = [dd.getDay() === 6 ? "sat" : dd.getDay() === 0 ? "sun" : "", k === TODAY ? "today" : ""].join(" ");
      html += `<button type="button" class="wd ${cls}" data-day="${k}" aria-pressed="${k === day}">
        <small>${DOW[dd.getDay()]}</small><b>${dd.getDate()}</b><span class="cnt"><i>${list.length}</i>件</span></button>`;
    }
    $("#week").innerHTML = html;
  }

  function renderStats(){
    const list = dayBookings(day);
    const act = list.filter(active);
    const sales = act.reduce((s, b) => s + b.price, 0);
    const used = act.reduce((s, b) => s + b.duration, 0);
    const blocked = blocks.filter(b => b.date === day).reduce((s, b) => s + (b.to - b.from), 0);
    const rate = Math.round(used / Math.max(1, CLOSE - OPEN - blocked) * 100);
    const firsts = act.filter(b => b.cust.visit === "初めて").length;
    const cancels = list.length - act.length;
    $("#stats").innerHTML = `
      <div class="stat"><div class="k">予約</div><div class="v">${act.length}<small>件</small></div><div class="k">キャンセル ${cancels}件</div></div>
      <div class="stat"><div class="k">売上見込み</div><div class="v">${yen(sales)}</div><div class="k">税込</div></div>
      <div class="stat"><div class="k">稼働率</div><div class="v">${rate}<small>%</small></div><div class="bar"><i style="width:${Math.min(rate,100)}%"></i></div></div>
      <div class="stat"><div class="k">初めてのお客様</div><div class="v">${firsts}<small>名</small></div><div class="k">カニューレの準備を</div></div>`;
  }

  function renderTimeline(){
    let html = "";
    for (let t = OPEN; t <= CLOSE; t += 30){
      html += `<div class="hr ${t % 60 ? "half" : ""}" style="top:${(t - OPEN) * PX}px">${t % 60 ? "" : `<span>${hm(t)}</span>`}</div>`;
    }
    for (const b of blocks.filter(b => b.date === day)){
      html += `<div class="ev blk" style="top:${(b.from - OPEN) * PX}px;height:${(b.to - b.from) * PX}px">
        <div class="t">${hm(b.from)}〜${hm(b.to)}</div><div class="n">受付停止</div><div class="m">${esc(b.reason)}</div></div>`;
    }
    for (const b of dayBookings(day)){
      const h = Math.max(b.duration * PX - 2, 28);
      html += `<button type="button" class="ev ${b.status === "done" ? "done" : b.status === "cancelled" ? "cancelled" : ""} ${selected === b.no ? "sel" : ""}" data-no="${esc(b.no)}" style="top:${(b.start - OPEN) * PX + 1}px;height:${h}px">
        <div class="t">${hm(b.start)}〜${hm(b.start + b.duration)}</div>
        <div class="n">${esc(b.cust.name)} 様${b.cust.visit === "初めて" ? '<span class="first">初回</span>' : ""}</div>
        <div class="m">${b.menus.map(id => MENU[id]?.name || id).join("＋")}</div></button>`;
    }
    if (day === TODAY && nowMin() >= OPEN && nowMin() <= CLOSE){
      html += `<div class="now" style="top:${(nowMin() - OPEN) * PX}px"></div>`;
    }
    const tl = $("#tl");
    tl.style.height = (CLOSE - OPEN) * PX + "px";
    tl.innerHTML = html;
  }

  const STATUS = {confirmed:"予約確定", done:"来店済み", cancelled:"キャンセル"};
  function renderList(){
    const list = dayBookings(day);
    $("#listCount").textContent = `${list.filter(active).length}件`;
    if (!list.length){ $("#list").innerHTML = `<li class="empty">この日の予約はまだありません。</li>`; return; }
    $("#list").innerHTML = list.map(b => `<li><button type="button" class="row" data-no="${esc(b.no)}" aria-pressed="${selected === b.no}">
      <span class="time">${hm(b.start)}</span>
      <span class="who"><b>${esc(b.cust.name)} 様</b><small>${b.menus.map(id => MENU[id]?.name || id).join("＋")}・${yen(b.price)}</small></span>
      ${b.cust.visit === "初めて" && active(b) ? '<span class="pill new">初回</span>' : ""}
      <span class="pill ${b.status}">${STATUS[b.status]}</span></button></li>`).join("");
  }

  function renderDetail(){
    const b = bookings.find(x => x.no === selected);
    $("#detailPanel").hidden = !b;
    if (!b) return;
    $("#detail").innerHTML = `
      <h3>${esc(b.cust.name)} 様</h3>
      <div class="sub">予約番号 ${esc(b.no)}・${esc(b.via)}で受付（${fmtDate(b.createdAt.slice(0,10))}）</div>
      <dl>
        <dt>日時</dt><dd>${fmtDate(b.date)} ${hm(b.start)}〜${hm(b.start + b.duration)}</dd>
        <dt>状態</dt><dd><span class="pill ${b.status}">${STATUS[b.status]}</span></dd>
        <dt>ご来店</dt><dd>${esc(b.cust.visit)}</dd>
        <dt>電話</dt><dd><a href="tel:${esc(b.cust.tel.replace(/-/g, ""))}">${esc(b.cust.tel)}</a></dd>
        <dt>メール</dt><dd>${esc(b.cust.email || "—")}</dd>
        <dt>メニュー</dt><dd><ul class="menus">
          ${b.menus.map(id => `<li><span>${esc(MENU[id]?.name || id)}</span><span>${yen(MENU[id]?.price || 0)}</span></li>`).join("")}
          <li class="total"><span>合計</span><span>${yen(b.price)}</span></li></ul></dd>
        ${b.cust.note ? `<dt>ご要望</dt><dd><div class="note">${esc(b.cust.note)}</div></dd>` : ""}
        <dt>お店用メモ</dt><dd><textarea class="memo" id="memo" rows="2" placeholder="お客様には表示されません">${esc(b.memo)}</textarea></dd>
      </dl>
      <div class="actions">
        ${b.status === "confirmed" ? `<button class="btn ok" data-act="done" type="button">来店済みにする</button>
          <button class="btn danger" data-act="cancel" type="button">キャンセルする</button>` : ""}
        ${b.status !== "confirmed" ? `<button class="btn plain" data-act="restore" type="button">予約確定に戻す</button>` : ""}
      </div>`;
  }

  function render(){
    $("#dateTitle").textContent = fmtDate(day);
    renderWeek(); renderStats(); renderTimeline(); renderList(); renderDetail();
  }

  // ---- events ----
  $("#prev").onclick = () => { day = addDays(day, -1); selected = null; render(); };
  $("#nextDay").onclick = () => { day = addDays(day, 1); selected = null; render(); };
  $("#today").onclick = () => { day = TODAY; selected = null; render(); };
  $("#week").onclick = e => { const b = e.target.closest("[data-day]"); if (!b) return; day = b.dataset.day; selected = null; render(); };
  function select(no){
    selected = no; render();
    if (matchMedia("(max-width:860px)").matches) $("#detailPanel").scrollIntoView({behavior:"smooth", block:"start"});
  }
  $("#tl").onclick = e => { const b = e.target.closest("[data-no]"); if (b) select(b.dataset.no); };
  $("#list").onclick = e => { const b = e.target.closest("[data-no]"); if (b) select(b.dataset.no); };
  $("#closeDetail").onclick = () => { selected = null; render(); };
  $("#detail").addEventListener("input", e => {
    if (e.target.id === "memo"){ const b = bookings.find(x => x.no === selected); if (b) b.memo = e.target.value; }
  });
  $("#detail").addEventListener("click", e => {
    const a = e.target.closest("[data-act]"); if (!a) return;
    const b = bookings.find(x => x.no === selected); if (!b) return;
    if (a.dataset.act === "cancel"){
      if (!confirm(`${b.cust.name} 様の予約をキャンセルしますか？`)) return;
      b.status = "cancelled"; toast("キャンセルしました（見本のため保存されません）");
    } else if (a.dataset.act === "done"){
      b.status = "done"; toast("来店済みにしました");
    } else {
      b.status = "confirmed"; toast("予約確定に戻しました");
    }
    render();
  });

  // ---- modals ----
  function timeOptions(sel, from, to, value){
    let h = ""; for (let t = from; t <= to; t += 30) h += `<option value="${t}" ${t === value ? "selected" : ""}>${hm(t)}</option>`;
    sel.innerHTML = h;
  }
  function openModal(id){ $(id).hidden = false; $(id).querySelector("input,select").focus(); }
  document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => {
    if (e.target === m || e.target.closest("[data-close]")) m.hidden = true;
  }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".modal").forEach(m => m.hidden = true); });

  $("#aMenu").innerHTML = COURSES.map(m => `<option value="${m.id}">${m.name}（${yen(m.price)}）</option>`).join("");
  $("#aOpts").innerHTML = OPTIONS.map(m => `<label><input type="checkbox" name="opt" value="${m.id}"> ${m.name.replace(/（.*）/, "")}</label>`).join("");
  $("#openAdd").onclick = () => {
    $("#addForm").reset(); $("#addErr").textContent = "";
    $("#aDate").value = day; timeOptions($("#aTime"), OPEN, CLOSE - 30, OPEN);
    openModal("#addModal");
  };
  const overlaps = (k, s, e) =>
    dayBookings(k).filter(active).some(b => s < b.start + b.duration && b.start < e) ||
    blocks.some(b => b.date === k && s < b.to && b.from < e);
  $("#addForm").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const menus = [f.get("menu"), ...f.getAll("opt")];
    const start = Number(f.get("time")); const dur = menus.reduce((s, id) => s + MENU[id].min, 0);
    const k = f.get("date");
    const err = !f.get("name").trim() ? "お名前を入力してください"
      : !k ? "日付を選んでください"
      : start + dur > CLOSE ? `終了が営業時間（${hm(CLOSE)}）を過ぎます`
      : overlaps(k, start, start + dur) ? "ほかの予約・受付停止と時間が重なっています" : "";
    $("#addErr").textContent = err; if (err) return;
    const no = "YUKI-" + Date.now().toString(36).toUpperCase().slice(-6);
    bookings.push({no, date:k, start, duration:dur, menus, price:menus.reduce((s, id) => s + MENU[id].price, 0),
      cust:{name:f.get("name").trim(), tel:f.get("tel").trim() || "—", email:"", visit:menus.includes("opt-cannula") ? "初めて" : "2回目以降", note:""},
      status:"confirmed", via:"電話", createdAt:TODAY, memo:f.get("note").trim()});
    $("#addModal").hidden = true; day = k; selected = no; render(); toast("予約を追加しました（見本のため保存されません）");
  };

  $("#openBlock").onclick = () => {
    $("#blockForm").reset(); $("#blockErr").textContent = ""; $("#bRange").hidden = false;
    $("#bDate").value = day; timeOptions($("#bFrom"), OPEN, CLOSE - 30, 780); timeOptions($("#bTo"), OPEN + 30, CLOSE, 900);
    openModal("#blockModal");
  };
  $("#bAll").onchange = e => $("#bRange").hidden = e.target.checked;
  $("#blockForm").onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target); const k = f.get("date");
    const from = f.get("allday") ? OPEN : Number(f.get("from")); const to = f.get("allday") ? CLOSE : Number(f.get("to"));
    const clash = dayBookings(k).filter(active).filter(b => from < b.start + b.duration && b.start < to);
    const err = !k ? "日付を選んでください" : to <= from ? "終了は開始より後にしてください"
      : clash.length ? `この時間には予約が${clash.length}件あります。先にお客様へ連絡・キャンセルしてください` : "";
    $("#blockErr").textContent = err; if (err) return;
    blocks.push({date:k, from, to, reason:f.get("reason").trim() || (f.get("allday") ? "臨時休業" : "受付停止")});
    $("#blockModal").hidden = true; day = k; selected = null; render(); toast("受付を止めました（見本のため保存されません）");
  };

  render();
})();
</script>
</body>
</html>
